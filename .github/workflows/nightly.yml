name: Nightly

# Fires on a merge to main. CI no longer runs on a push, because a pull request has to be green
# before it can merge — so the code landing here has already been tested, and this builds it rather
# than testing it again. Does NOT push to NuGet: publishing is release-only.
#
# The trade-off, stated plainly: a squash merge produces a commit no run ever saw. It carries the
# pull request's tree onto a base that may have moved, so a semantic conflict between two separately
# green pull requests would first show up here, as a failed nightly build.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  # The marker only. _build.yml has to be told the version before it can stamp it.
  meta:
    uses: Hawkynt/RepositoryTemplate/.github/workflows/nightly-publish.yml@v1

  build:
    needs: meta
    uses: ./.github/workflows/_build.yml
    with:
      version: ${{ needs.meta.outputs.version }}
      release-kind: nightly
      changelog-flag: --nightly --version ${{ needs.meta.outputs.version }}
      ref: ${{ needs.meta.outputs.sha }}

  # Download, notes, replace any same-date release, publish, GFS-prune.
  publish:
    needs: [meta, build]
    uses: Hawkynt/RepositoryTemplate/.github/workflows/nightly-publish.yml@v1
    with:
      artifact: ${{ needs.build.outputs.exe-artifact }}
      files: 'dist/*.zip'
      tag: ${{ needs.meta.outputs.tag }}
      version: ${{ needs.meta.outputs.version }}
      date: ${{ needs.meta.outputs.date }}
      sha: ${{ needs.meta.outputs.sha }}
